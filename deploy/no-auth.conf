# Explicitly disable login for this instance. Applies after har-canvas.service.
[Service]
EnvironmentFile=
UnsetEnvironment=HAR_CANVAS_USER HAR_CANVAS_PASSWORD
ExecStart=
ExecStart=/data/workspace/har-canvas/current/har-canvas -addr 127.0.0.1:8090 -web /data/workspace/har-canvas/current/web/dist -sample-har /data/workspace/har-canvas/shared/re.har
